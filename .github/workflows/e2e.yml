name: E2E

# End-to-end tests for the arbiter node.
#
# Secrets (Settings → Secrets and variables → Actions, ideally scoped to the
# "e2e" Environment):
#   IPFS_PINNING_KEY        Pinata JWT (least-privilege, pinning-only). Needed by
#                           the External Adapter to upload justifications (L2).
#   RPC_URL                 Base Sepolia RPC endpoint (L4).
#   E2E_WALLET_PRIVATE_KEY  Dedicated, funded *testnet* wallet key (L4). NEVER a
#                           mainnet key. Keep in the "e2e" Environment.
#   AGGREGATOR_ADDRESS      (optional) overrides the default aggregator (L4).
#
# NOTE: GitHub does not expose secrets to workflows triggered by pull_request
# from forks. The secret-dependent jobs below are gated to same-repo events.
#
# claude/stake-attestation is the stake-attestation integration branch: its
# node PRs land there, not in main, and need the same checks (issue #105).
# .github/tests/workflow-triggers.test.sh pins these triggers.

on:
  pull_request:
    branches: [main, master, claude/stake-attestation]
    paths: ['e2e/**', 'external-adapter/**', 'ai-node/**', 'code-runner/**', 'testing-tool/**', '.github/workflows/e2e.yml']
  push:
    branches: [main, master, claude/stake-attestation]
    paths: ['e2e/**', 'external-adapter/**', 'ai-node/**', 'code-runner/**', 'testing-tool/**', '.github/workflows/e2e.yml']
  schedule:
    - cron: '0 7 * * *'   # nightly acceptance (L4)
  workflow_dispatch:
    inputs:
      run_l4:
        description: 'Run L4 live-testnet acceptance'
        type: boolean
        default: false
      class_id:
        description: 'L4: class to request. 5555 is the testnet canary class (arbiters we control, upgraded first); the nightly uses config.l4.classId (128).'
        type: string
        default: '5555'
      expect_common:
        description: 'L4: fail unless every revealing arbiter reports this @verdikta/common version (e.g. 1.7.0). Blank = report only.'
        type: string
        default: ''
      expect_release:
        description: 'L4: fail unless every revealing arbiter reports this release commit (prefix match). Blank = report only.'
        type: string
        default: ''
      scenario:
        description: 'L4: comma-separated scenario ids (blank = all but manual and claim ones). claim-l4-* run only with class_id 5555 and both expect inputs.'
        type: string
        default: ''
      expect_fault_switch:
        description: 'L4, a claim run: the canary fault switch every revealing arbiter must report, off or armed (blank = off). Fault scenarios need armed. See docs/release-runbook.md 3b.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── L2: off-chain arbiter pipeline (mock AI, deterministic) ────────────────
  l2-mock:
    name: L2 pipeline (mock AI)
    # Secrets are unavailable to fork PRs; skip there instead of failing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install External Adapter deps (needed for --boot-adapter)
        working-directory: external-adapter
        run: npm ci

      - name: Install E2E harness deps
        working-directory: e2e
        run: npm ci

      - name: Validate canonical evidence archive (no secrets needed)
        working-directory: e2e
        run: node scripts/build-archive.js --validate --predict-cid

      - name: Run L2 (mock AI, boot adapter)
        working-directory: e2e
        env:
          IPFS_PINNING_KEY: ${{ secrets.IPFS_PINNING_KEY }}
        run: |
          if [ -z "$IPFS_PINNING_KEY" ]; then
            echo "::warning::IPFS_PINNING_KEY not set — skipping L2 (adapter cannot upload justifications)."
            exit 0
          fi
          node src/index.js l2 --mock --boot-adapter \
            --junit results/l2-mock.xml --report results/l2-mock.json

      - name: Upload L2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-mock-report
          path: e2e/results/
          if-no-files-found: ignore

  # ── L2: the local claim pipeline. No secret, no fork gate, no way out: a harness
  # that cannot start fails it. The real External Adapter, AI Node (mock provider)
  # and code runner, with a local IPFS and a registry:2. ubuntu-latest is linux/amd64,
  # the only platform a Verification Report exists on, and the variable below makes
  # the suite refuse anything else, so the valid claim really reaches the jury here.
  l2-claim:
    name: L2 claim pipeline (local, no secret)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install External Adapter deps
        working-directory: external-adapter
        run: npm ci

      - name: Install AI Node deps
        working-directory: ai-node
        run: npm ci

      - name: Install code runner deps
        working-directory: code-runner
        run: npm ci

      - name: Install testing tool deps
        working-directory: testing-tool
        run: npm ci

      - name: Install E2E harness deps
        working-directory: e2e
        run: npm ci

      - name: Harness unit tests
        working-directory: e2e
        run: npm test

      - name: Testing tool unit tests
        working-directory: testing-tool
        run: npm test

      # The EA reads the merged runner through jest's modulePaths (A4b).
      - name: EA against the merged runner
        working-directory: external-adapter
        run: npx jest src/__tests__/codeReview/runnerContract.test.js

      - name: AI Node mock provider
        working-directory: ai-node
        run: npx jest src/__tests__/lib/llm/mock-provider.test.ts

      - name: Run the claim suite
        working-directory: e2e
        env:
          E2E_CLAIM_REQUIRE_CLASS_PLATFORM: '1'
          E2E_CLAIM_LOG_DIR: ${{ runner.temp }}/claim-logs
        run: |
          node src/index.js l2 --mock --boot-adapter --suite claim \
            --junit results/l2-claim.xml --report results/l2-claim.json

      - name: No container left behind
        if: always()
        run: |
          left=$(docker ps --all --format '{{.Names}}' | grep -E '^(vcr-|e2e)' || true)
          if [ -n "$left" ]; then
            echo "::error::containers left behind: $left"
            exit 1
          fi

      - name: Upload the report and the service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-claim-report
          path: |
            e2e/results/
            ${{ runner.temp }}/claim-logs/*.log
          if-no-files-found: ignore

  # ── L4: live testnet acceptance (Base Sepolia) ─────────────────────────────
  l4-testnet:
    # Static name: a job name with an expression renders as the raw template in
    # the PR checks list when the job is skipped. The class is logged instead.
    name: L4 acceptance (Base Sepolia)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_l4)
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E harness deps
        working-directory: e2e
        run: npm ci

      - name: Run L4 (live testnet)
        working-directory: e2e
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          AGGREGATOR_ADDRESS: ${{ secrets.AGGREGATOR_ADDRESS }}
          E2E_WALLET_PRIVATE_KEY: ${{ secrets.E2E_WALLET_PRIVATE_KEY }}
          # Dispatch inputs (empty on the nightly schedule → config defaults apply).
          L4_CLASS_ID: ${{ inputs.class_id }}
          L4_EXPECT_COMMON: ${{ inputs.expect_common }}
          L4_EXPECT_RELEASE: ${{ inputs.expect_release }}
          L4_SCENARIO: ${{ inputs.scenario }}
          L4_EXPECT_FAULT_SWITCH: ${{ inputs.expect_fault_switch }}
        run: |
          if [ -z "$E2E_WALLET_PRIVATE_KEY" ] || [ -z "$RPC_URL" ]; then
            echo "::error::L4 requires RPC_URL and E2E_WALLET_PRIVATE_KEY secrets."
            exit 1
          fi
          node src/index.js l4 --junit results/l4.xml --report results/l4.json

      - name: Upload L4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-report
          path: e2e/results/
          if-no-files-found: ignore
